[package]
name = "dataflowbench"
version = "0.1.0"
edition = "2024"
description = "Analyzer-neutral benchmark for data-flow analysis"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
jsonschema = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
