# Manual GitHub Pages deployment. Deployment stays manual until the
# release/freeze workflow is proven; trigger it from the Actions tab after a
# freeze merges.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify and stage versioned v0.9.2 raw evidence
        working-directory: .
        run: |
          python3 -B scripts/v092_ledger_archive.py hydrate-current --root .
          python3 -B scripts/v092_publication_evidence.py hydrate --root .
          python3 -B scripts/v092_publication_evidence.py stage-site --root . --output docs/public/evidence/v0-9-2
      - name: Verify and stage the separate v0.9.2 timing supplement
        working-directory: .
        run: python3 -B scripts/v092_timing_publication.py stage-site --root . --output docs/public/evidence/timing/v0-9-2/20261113-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
