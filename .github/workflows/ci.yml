name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked text files for merge conflict markers
        # The patterns are anchored to the start of the line, so this
        # script's own indented lines never match themselves. -I skips
        # binary files.
        run: |
          if git grep -I -nE '^(<<<<<<< |=======$|>>>>>>> )' -- .; then
            echo "::error::Merge conflict markers found in tracked files (see matches above)"
            exit 1
          fi
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Freeze validation resolves the frozen evidence revision and the
          # release tag, so the full history and tags must be present.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo run -- validate
      - run: cargo run -- validate-reports
      # TEMPORARY v0.7.1 evidence transition. Restore current-checkout generation
      # in the separate final manifest PR; the byte guard rejects a new freeze.
      - name: Validate unchanged published results during evidence refresh
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code 61300f47de7affa651fbd4a125ca6b894b29ce71 HEAD -- reports/freeze.json results/
          snapshot_dir="$(mktemp -d "$RUNNER_TEMP/dfb-published.XXXXXX")"
          git worktree add --detach "$snapshot_dir" 61300f47de7affa651fbd4a125ca6b894b29ce71
          trap 'git worktree remove --force "$snapshot_dir"' EXIT
          (
            cd "$snapshot_dir"
            cargo run --locked -- generate-results --manifest reports/freeze.json --output-directory results --check
          )
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
