name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked text files for merge conflict markers
        # The patterns are anchored to the start of the line, so this
        # script's own indented lines never match themselves. -I skips
        # binary files.
        run: |
          if git grep -I -nE '^(<<<<<<< |=======$|>>>>>>> )' -- .; then
            echo "::error::Merge conflict markers found in tracked files (see matches above)"
            exit 1
          fi
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Freeze validation resolves the frozen evidence revision and the
          # release tag, so the full history and tags must be present.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo run -- validate
      - run: cargo run -- validate-reports
      - name: Test Swift fixture validation controls
        run: python3 scripts/test-swift-fixtures.py
      - name: Test isolated release validation gate
        run: python3 scripts/test-release-results.py
      - name: Test versioned release execution guard
        run: python3 scripts/test-release-harness.py
      - name: Check resolved v0.8.0 release plan
        run: python3 scripts/prepare-v080-execution-plan.py
      - name: Validate current release in an isolated tag checkout
        run: python3 scripts/check-release-results.py --binary "$PWD/target/debug/dataflowbench"

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  swift-fixtures:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Compile, link, and exercise Swift fixtures under witnessed CI profile
        run: python3 scripts/validate-swift-fixtures.py --profile github-xcode27 --output "$RUNNER_TEMP/swift-fixture-evidence"
      - name: Retain compilation identity and all attempted controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-fixture-evidence
          path: ${{ runner.temp }}/swift-fixture-evidence
          if-no-files-found: error
