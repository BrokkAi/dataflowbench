# DataFlowBench benchmark-controlled endpoint rule for the OpenTaint Kotlin
# kernel. The runner resolves dfb_source and dfb_sink per case from the
# fixture's own DFB-SOURCE:/DFB-SINK: marker lines and retains the resolved
# copy beside each case's raw evidence.
#
# `languages: [java]` is deliberate: the pinned analyzer keys its JVM rule
# front end on `java` and analyzes Kotlin through the same bytecode IR — a rule
# declaring `languages: [kotlin]` loads but matches nothing. The Kotlin
# fixtures are compiled with kotlinc and analyzed as bytecode, so the `java`
# key is the engine's name for the JVM surface, not a claim that the fixture is
# Java. Verified against the pinned analyzer on real Kotlin fixtures.
#
# The receiver-qualified callsite forms are load-bearing here: every Kotlin
# `object` member call lowers to an INSTANCE-received invocation, which the
# receiverless pattern alone does not match.
rules:
  - id: dfb-opentaint-kernel
    severity: ERROR
    message: DataFlowBench benchmark-controlled endpoint flow
    languages:
      - java
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: dfb_source()
          - pattern: $DFBRECV.dfb_source()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: dfb_sink($DFBVAL);
              - pattern: $DFBSINKRECV.dfb_sink($DFBVAL);
          - focus-metavariable: $DFBVAL
