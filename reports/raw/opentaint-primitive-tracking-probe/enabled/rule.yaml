rules:
  - id: value-kind-string
    severity: ERROR
    message: primitive-tracking probe (string)
    languages: [java]
    mode: taint
    options:
      primitive-tracking: true
    pattern-sources:
      - pattern: string_src()
    pattern-sinks:
      - patterns:
          - pattern: string_sink($DFBVAL);
          - focus-metavariable: $DFBVAL
  - id: value-kind-object
    severity: ERROR
    message: primitive-tracking probe (object)
    languages: [java]
    mode: taint
    options:
      primitive-tracking: true
