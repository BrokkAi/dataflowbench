  metadata:
    name: DataFlowBench Python taint-modeling load-bearing probe
    description: |-
      `PythonModeling.ql` with template 3's propagator declaration
                    — and only that declaration — removed. It exists to demonstrate
                    that the model, not the propagation, is what the modeling
                    matrix scores: run both queries over the same
                    `model-opaque-propagator-positive` database and the finding
                    disappears with the declaration. This query never scores a
                    case, is never named by a case's `tool_model_references`, and
                    is never bound into a modeling report's `configuration_hash`.
                    See docs/python-modeling.md#load-bearing-verification.
    kind: problem
    problem.severity: warning
    precision: high
    id: dataflowbench/python-taint-modeling-probe
    tags: security
