rules:
  - id: value-kind-string
    severity: ERROR
    message: value-kind probe (string)
    languages: [java]
    mode: taint
    pattern-sources:
      - pattern: string_src()
    pattern-sinks:
      - patterns:
          - pattern: string_sink($DFBVAL);
          - focus-metavariable: $DFBVAL
  - id: value-kind-object
    severity: ERROR
    message: value-kind probe (object)
    languages: [java]
    mode: taint
    pattern-sources:
