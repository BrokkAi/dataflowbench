rules:
  - id: probe-opentaint-modeling
    severity: ERROR
    message: OpenTaint modeling-surface probe
    languages: [java]
    mode: taint
    options:
      primitive-tracking: true
    pattern-sources:
      - pattern: dfb_probe_function_that_does_not_exist()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: dfb_sink($DFBVAL);
              - pattern: $DFBSINKRECV.dfb_sink($DFBVAL);
          - focus-metavariable: $DFBVAL
